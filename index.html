<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CommentLens – Recommendation Trust Auditor</title>

<style>
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
background:#f7f8fa;
margin:0;
color:#1f2937;
}

.container{
max-width:960px;
margin:auto;
padding:40px 20px;
}

.hero{
background:linear-gradient(135deg,#0f172a,#334155);
color:white;
padding:32px;
border-radius:18px;
margin-bottom:24px;
}

.hero h1{
margin:0 0 12px;
font-size:34px;
}

.card{
background:white;
padding:24px;
border-radius:16px;
box-shadow:0 4px 14px rgba(0,0,0,.06);
margin-bottom:22px;
}

textarea{
width:100%;
height:220px;
padding:14px;
font-size:15px;
border-radius:12px;
border:1px solid #d1d5db;
resize:vertical;
}

select{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid #d1d5db;
margin-top:8px;
}

button{
margin-top:18px;
background:#111827;
color:white;
padding:14px 22px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
}

button:hover{
opacity:.92;
}

.metric{
display:inline-block;
background:#eef2ff;
padding:14px 18px;
border-radius:12px;
margin:8px 8px 8px 0;
font-weight:600;
}

.high{color:#15803d;font-weight:700;}
.medium{color:#b45309;font-weight:700;}
.low{color:#dc2626;font-weight:700;}

ul{line-height:1.7;}
</style>
</head>

<body>

<div class="container">

<div class="hero">
<h1>🔍 Recommendation Trust Auditor</h1>
<p>
A lightweight interactive prototype for evaluating whether online recommendations are supported by credible evidence —
or mainly driven by visibility, repetition, and weak signals.
</p>
</div>

<div class="card">
<h2>1. Select Source Type</h2>

<select id="source">
<option>Google Reviews</option>
<option>Reddit</option>
<option>RedNote / Xiaohongshu</option>
<option>TikTok Comments</option>
<option>Other Online Discussion</option>
</select>
</div>

<div class="card">
<h2>2. Paste Comments</h2>

<textarea id="comments">
Loved the coffee and the space was cozy, but the line was almost 25 minutes.
Staff were friendly and the pastries were great.
I saw this place everywhere on TikTok so I expected more.
Good location but overpriced.
Worth trying once.
The interior is beautiful and clean.
Service was a bit slow during brunch.
Not bad, but slightly overhyped.
Would come back for the latte.
</textarea>

<button onclick="analyzeComments()">Analyze Evidence</button>
</div>

<div id="results"></div>

</div>

<script>
function analyzeComments(){

const text = document.getElementById("comments").value;
const source = document.getElementById("source").value;

const comments = text
.split(/\n+/)
.map(c => c.trim())
.filter(c => c.length > 0);

const positiveWords = [
"good","great","love","loved","amazing","best","worth","friendly","cozy","clean"
];

const negativeWords = [
"bad","slow","expensive","overpriced","overhyped","crowded","disappointed","rude"
];

const promoWords = [
"must try","viral","hidden gem","best ever","life changing","overhyped"
];

let positive=0;
let negative=0;
let promo=0;

comments.forEach(comment=>{
const c = comment.toLowerCase();

positiveWords.forEach(w=>{
if(c.includes(w)) positive++;
});

negativeWords.forEach(w=>{
if(c.includes(w)) negative++;
});

promoWords.forEach(w=>{
if(c.includes(w)) promo++;
});
});

let strength = "";
let strengthClass = "";
let concerns = [];

if(comments.length >= 8 && promo < 3){
strength="High";
strengthClass="high";
}else if(comments.length >=4){
strength="Medium";
strengthClass="medium";
}else{
strength="Low";
strengthClass="low";
}

if(comments.length < 5){
concerns.push("Limited sample size may not represent broader user experience.");
}

if(promo >= 2){
concerns.push("Repeated hype or promotional language may reflect visibility rather than quality.");
}

if(positive > 0 && negative > 0){
concerns.push("Mixed signals suggest the recommendation is not universally consistent.");
}

if(concerns.length===0){
concerns.push("Evidence appears relatively balanced, but human review is still recommended.");
}

let html = `
<div class="card">
<h2>3. Evidence Summary</h2>

<div class="metric">Comments Reviewed: ${comments.length}</div>
<div class="metric">Positive Signals: ${positive}</div>
<div class="metric">Negative Signals: ${negative}</div>
<div class="metric">Promotional Signals: ${promo}</div>

</div>

<div class="card">
<h2>4. Trust Assessment</h2>

<p>
Evidence Strength:
<span class="${strengthClass}">
${strength}
</span>
</p>

<p>
Source Context:
<strong>${source}</strong>
</p>

<ul>
${concerns.map(c=>`<li>${c}</li>`).join("")}
</ul>

</div>

<div class="card">
<h2>5. Decision Brief</h2>

<p>
Based on the comments provided, this recommendation should be treated as
<strong>${strength==="High" ? "decision-supportive" : "directional but not conclusive"}</strong>.
</p>

<p>
The strongest signals come from repeated user mentions around quality, service, and overall experience.
However, reviewers should check whether visibility effects, repeated promotional language, or platform-specific bias may be shaping the recommendation.
</p>

<p>
Before relying on this recommendation, a human reviewer should compare evidence across at least one additional source.
</p>

</div>

<div class="card">
<h2>6. Human Review Checklist</h2>

<ul>
<li>☐ Are comments coming from independent users?</li>
<li>☐ Are specific details present beyond vague praise?</li>
<li>☐ Is more than one platform represented?</li>
<li>☐ Could visibility or influencer amplification be shaping results?</li>
<li>☐ Is uncertainty clearly communicated before a final recommendation?</li>
</ul>
</div>
`;

document.getElementById("results").innerHTML = html;
}
</script>

</body>
</html>
